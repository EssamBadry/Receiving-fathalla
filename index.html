<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسواق فتح الله - نظام استلام أذونات الصرف</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS (XLSX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .bg-fathalla { background-color: #ea580c; }
        .hover-fathalla:hover { background-color: #c2410c; }
        .border-fathalla { border-color: #ea580c; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navbar with Logo -->
    <header class="bg-fathalla text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-2.5 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <!-- App Logo -->
                <div class="bg-white p-1 rounded-xl shadow-md w-11 h-11 flex items-center justify-center overflow-hidden border border-orange-200">
                    <img src="fathalla_market_logo_transparent.png" alt="Fathalla Logo" class="w-full h-full object-contain" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23ea580c\'><path d=\'M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z\'/></svg>'">
                </div>
                <div>
                    <h1 class="font-extrabold text-lg leading-tight">أسواق فتح الله ماركت</h1>
                    <p class="text-xs text-orange-100">نظام استلام وتفريغ أذونات الشيتات</p>
                </div>
            </div>
            
            <div id="activeDocBadge" class="hidden bg-orange-700/70 border border-orange-400 px-3 py-1 rounded-full text-xs font-semibold">
                الإذن: <span id="docNumberDisplay" class="font-bold text-yellow-300">--</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col gap-6">

        <!-- 1. Gateway Screen (Upload Excel) -->
        <section id="uploadGateway" class="bg-white rounded-2xl shadow-xl border-2 border-dashed border-orange-300 p-8 text-center my-auto max-w-2xl mx-auto w-full">
            <!-- Large Main Logo -->
            <div class="w-28 h-28 bg-orange-50 rounded-2xl p-3 flex items-center justify-center mx-auto mb-4 border border-orange-200 shadow-inner">
                <img src="fathalla_market_logo_transparent.png" alt="Fathalla Receiving System Logo" class="w-full h-full object-contain" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23ea580c\'><path d=\'M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z\'/></svg>'">
            </div>
            <h2 class="text-2xl font-extrabold mb-2 text-slate-800">تفريغ أذونات استلام فتح الله ماركت</h2>
            <p class="text-slate-500 text-sm mb-6">اختر أي ملف إكسيل أو CSV لقراءته واستخراج الأصناف مباشرة للعمل</p>
            
            <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="hidden">
            
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <button onclick="document.getElementById('excelFileInput').click()" class="bg-fathalla text-white px-8 py-3.5 rounded-xl font-bold hover-fathalla shadow-lg flex items-center justify-center gap-2 text-lg">
                    <i data-lucide="upload" class="w-5 h-5"></i>
                    اختيار ملف Excel
                </button>
                <button onclick="loadDemoData()" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-6 py-3.5 rounded-xl font-semibold border border-slate-300 flex items-center justify-center gap-2">
                    <i data-lucide="play-circle" class="w-5 h-5"></i>
                    تجربة شيت تجريبي (إذن 3285)
                </button>
            </div>
        </section>
