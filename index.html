<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Receiving System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--panel:#fff;--soft:#f8fafc;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b;--acc:#ea580c;--on:#fff;--shadow:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06);
--okb:#d1fae5;--okf:#065f46;--hfb:#fef3c7;--hff:#92400e;--exb:#fee2e2;--exf:#991b1b;--nob:#e2e8f0;--nof:#334155}
[data-theme=dark]{--bg:#0f172a;--panel:#1e293b;--soft:#162032;--line:#334155;--txt:#f1f5f9;--mut:#94a3b8;--acc:#f97316;--on:#0f172a;--shadow:0 8px 28px rgba(0,0,0,.35);
--okb:rgba(16,185,129,.18);--okf:#6ee7b7;--hfb:rgba(245,158,11,.2);--hff:#fcd34d;--exb:rgba(239,68,68,.2);--exf:#fca5a5;--nob:rgba(148,163,184,.2);--nof:#cbd5e1}
*{box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;margin:0;transition:background .2s,color .2s}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:1.25rem 1rem 3rem}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--panel);border:1px solid var(--line);border-bottom:4px solid var(--acc);border-radius:1rem;padding:1rem 1.25rem;margin-bottom:1.5rem;box-shadow:var(--shadow)}
.logo{width:46px;height:46px;border-radius:.85rem;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:1.4rem}
.topbar h1{font-size:1.35rem;font-weight:800;line-height:1.3;margin:0}
.topbar p{color:var(--mut);font-size:.85rem;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:1rem;box-shadow:var(--shadow)}
.pad{padding:1.5rem}
.lbl{display:block;font-size:.85rem;font-weight:600;color:var(--mut)}
.lbl .inp{margin-top:.45rem}
.inp{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:.7rem;padding:.7rem .9rem;color:var(--txt);font:inherit}
.inp:focus{outline:2px solid var(--acc);outline-offset:1px}
.inp:disabled{opacity:.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border-radius:.7rem;padding:.65rem 1.1rem;font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--soft);color:var(--txt);transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn-pri{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn-sm{padding:.3rem .9rem;font-size:.85rem}
.drop{display:block;text-align:center;border:2px dashed var(--acc);border-radius:.9rem;padding:1.25rem;font-weight:700;color:var(--acc);cursor:pointer;background:var(--soft)}
.drop:hover{filter:brightness(1.1)}
.drop small{display:block;color:var(--mut);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.25rem .9rem;font-size:.85rem;color:var(--mut)}
.chip b{color:var(--txt);margin-inline-start:.3rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:.6rem 0 1.25rem}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.t{width:100%;border-collapse:collapse;font-size:.9rem;text-align:center;white-space:nowrap}
.t th{background:var(--soft);color:var(--mut);font-weight:700;padding:.85rem .9rem;border-bottom:1px solid var(--line)}
.t td{padding:.75rem .9rem;border-bottom:1px solid var(--line)}
.t tr:hover td{background:var(--soft)}
.t tr.done td{background:color-mix(in srgb,var(--acc) 7%,transparent)}
.t .nm{text-align:right;white-space:normal;min-width:220px}
.badge{display:inline-block;padding:.2rem .7rem;border-radius:.5rem;font-weight:600;font-size:.82rem}
.b-ok{background:var(--okb);color:var(--okf)}.b-half{background:var(--hfb);color:var(--hff)}.b-exp{background:var(--exb);color:var(--exf)}.b-none{background:var(--nob);color:var(--nof)}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.6);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1.5rem;width:100%;max-width:440px;display:flex;flex-direction:column;gap:1.1rem;box-shadow:var(--shadow);max-height:92vh;overflow:auto}
.expq{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:.8rem;padding:.7rem 1rem}
.expq b{font-size:1.6rem;color:var(--acc);font-weight:800}
.yrs{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;margin-top:.45rem}
.yb{padding:.55rem 0;border-radius:.6rem;border:1px solid var(--line);background:var(--soft);color:var(--txt);font:inherit;font-weight:700;cursor:pointer}
.yb.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.yb:disabled{opacity:.4;cursor:default}
.sug{position:absolute;z-index:30;inset-inline:0;top:100%;margin-top:.35rem;background:var(--panel);border:1px solid var(--line);border-radius:.8rem;max-height:18rem;overflow:auto;box-shadow:var(--shadow)}
.sug-item{display:flex;justify-content:space-between;gap:1rem;width:100%;text-align:right;padding:.65rem 1rem;border:0;border-bottom:1px solid var(--line);background:none;color:var(--txt);font:inherit;cursor:pointer}
.sug-item:hover{background:var(--soft)}.sug-item .qn{color:var(--acc);font-weight:700}
@media(max-width:700px){
 .wrap{padding:.75rem .65rem 2rem}
 .topbar{padding:.75rem .9rem;margin-bottom:1rem;border-radius:.9rem}
 .topbar h1{font-size:1.1rem}.topbar p{font-size:.72rem}
 .logo{width:38px;height:38px;font-size:1.1rem}
 #themeBtn{padding:.5rem .7rem;font-size:.8rem}
 .pad{padding:1.1rem}
 .inp{font-size:16px;padding:.8rem .9rem}
 .btn{min-height:46px}
 .tools .btn{flex:1 1 calc(50% - .5rem)}
 .tools>.relative{flex:1 1 100%!important}
 .chips{gap:.4rem}.chip{font-size:.78rem;padding:.15rem .7rem}
 .t,.t tbody{display:block}.t thead{display:none}
 .t tr{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .9rem;padding:1rem;border-bottom:1px solid var(--line)}
 .t tr:hover td{background:none}
 .t td{display:block;border:0;padding:0;text-align:right;white-space:normal}
 .t td[data-label]::before{content:attr(data-label);display:block;font-size:.72rem;color:var(--mut)}
 .t td:first-child{display:none}
 .t td.nm{grid-column:1/-1;font-weight:700;font-size:1rem;min-width:0}
 .t td.st,.t td.act{grid-column:1/-1}
 .t td.act .btn{width:100%;padding:.7rem}
 .modal{align-items:flex-end;padding:0}
 .sheet{max-width:100%;border-radius:1.2rem 1.2rem 0 0;padding:1.25rem 1.1rem 1.5rem;max-height:94vh}
}
#printDoc{display:none}
@media print{
 @page{size:A4;margin:12mm}
 html,body{background:#fff!important}
 .wrap,.modal{display:none!important}
 #printDoc{display:block;color:#000;background:#fff;font-size:12px}
 #printDoc table{width:100%;border-collapse:collapse;margin-top:10px}
 #printDoc th,#printDoc td{border:1px solid #000;padding:4px 5px;text-align:center}
 #printDoc th{background:#e5e5e5}
}
</style>
</head>
<body>
<div class="wrap">
 <header class="topbar">
  <div class="flex items-center gap-3"><div class="logo">ف</div><div><h1>Receiving System</h1><p>أسواق فتح الله ماركت — استلام التحويلات المخزنية</p></div></div>
  <button id="themeBtn" class="btn" onclick="setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')"></button>
 </header>

 <section id="gate" class="card pad" style="max-width:600px;margin:0 auto">
  <h2 class="text-xl font-extrabold" style="margin:0 0 .25rem">رفع إذن الصرف</h2>
  <p style="color:var(--mut);font-size:.9rem;margin:0 0 1.5rem">ارفع ملف الإذن وسيتم ملء البيانات تلقائيًا، ويمكنك تعديلها.</p>
  <div class="grid gap-4 sm:grid-cols-2">
   <label class="lbl">رقم الإذن<input id="fNo" class="inp" inputmode="numeric"></label>
   <label class="lbl">تاريخ الاستلام<input id="fDate" type="date" class="inp"></label>
   <label class="lbl">فرع الصرف<input id="fFrom" class="inp"></label>
   <label class="lbl">فرع الاستلام<input id="fTo" class="inp" value="فلمنج"></label>
   <label class="lbl sm:col-span-2">اسم المسئول<input id="fUser" class="inp"></label>
  </div>
  <label class="drop" style="margin-top:1.5rem">رفع ملف الإذن<small>Excel / CSV / Xls</small><input id="file" type="file" accept=".xls,.xlsx,.csv" class="hidden"></label>
  <p id="gErr" style="color:#ef4444;font-size:.9rem;margin:.75rem 0 0"></p>
 </section>

 <section id="work" class="hidden">
  <div id="infoBar" class="chips"></div>
  <div class="card pad" style="padding:1rem">
   <div class="flex flex-wrap gap-3 tools">
    <div class="relative" style="flex:1 1 220px"><input id="q" class="inp" placeholder="اكتب اسم الصنف أو الباركود (4 أرقام أو أكثر)" autocomplete="off"><div id="sug" class="sug hidden"></div></div>
    <button onclick="cam()" class="btn">فتح الكاميرا</button>
    <button onclick="finish()" class="btn btn-pri">إنهاء وطباعة التقرير</button>
   </div>
   <div class="flex justify-between text-sm" style="color:var(--mut);margin-top:.9rem"><span id="prog"></span><span id="msg" style="color:var(--acc)"></span></div>
   <div class="bar" style="margin-bottom:0"><i id="barI"></i></div>
   <div id="camBox" class="hidden" style="margin-top:1rem"><div id="reader"></div><button onclick="stopCam()" class="btn" style="margin-top:.6rem">إغلاق الكاميرا</button></div>
  </div>
  <div class="card" style="margin-top:1.25rem;overflow:hidden"><div style="overflow-x:auto">
   <table class="t"><thead><tr><th>م</th><th>الباركود</th><th style="text-align:right">الاسم</th><th>المصدرة</th><th>المستلمة</th><th>الإنتاج</th><th>الانتهاء</th><th>التقييم</th><th></th></tr></thead><tbody id="tb"></tbody></table>
  </div></div>
 </section>
</div>

<div id="modeM" class="modal hidden"><div class="sheet" style="text-align:center">
 <h3 class="text-lg font-extrabold" style="margin:0">هل الإذن يتطلب صلاحية؟</h3>
 <p id="modeInfo" style="color:var(--mut);font-size:.9rem;margin:0"></p>
 <div class="flex gap-3"><button onclick="setMode(true)" class="btn btn-pri flex-1" style="padding:.8rem">نعم</button><button onclick="setMode(false)" class="btn flex-1" style="padding:.8rem">لا</button></div>
</div></div>

<div id="actM" class="modal hidden"><div class="sheet">
 <div><h3 id="aName" class="text-lg font-extrabold" style="margin:0"></h3><p id="aSub" style="color:var(--mut);font-size:.85rem;margin:.2rem 0 0"></p></div>
 <div class="expq"><span style="color:var(--mut);font-size:.9rem">الكمية في إذن الصرف</span><b id="aExp"></b></div>
 <label class="lbl">الكمية المستلمة (عدّلها لو مختلفة)<input id="aQty" type="number" min="0" step="any" inputmode="decimal" class="inp"></label>
 <div id="expBox" class="flex flex-col gap-4">
  <label class="lbl">تاريخ الإنتاج (شهر/سنة)<input id="aProd" type="month" class="inp"></label>
  <div><span class="lbl">مدة الصلاحية (سنوات)</span><div id="yrs" class="yrs"></div></div>
  <label class="flex items-center gap-2 text-sm"><input id="aNo" type="checkbox" onchange="togNo()" style="width:1.05rem;height:1.05rem;accent-color:var(--acc)"> بدون صلاحية</label>
 </div>
 <div class="flex gap-3"><button onclick="saveAct()" class="btn btn-pri flex-1" style="padding:.8rem">حفظ</button><button onclick="show('actM',false)" class="btn flex-1" style="padding:.8rem">إلغاء</button></div>
</div></div>

<div id="printDoc"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const show=(id,v=true)=>$(id).classList.toggle('hidden',!v);
const ST={ok:['سارية (مقبولة) ✅','b-ok'],half:['تخطت نصف المدة ⚠️','b-half'],exp:['منتهي الصلاحية ❌','b-exp'],none:['بدون صلاحية','b-none']};
let items=[],needExp=false,cur=-1,years=0,info={},sc=null;
$('fDate').value=new Date().toISOString().slice(0,10);

/* ---------- Parsing ---------- */
const clean=v=>v==null?'':String(v).trim().replace(/\.0+$/,'');
const bad=s=>/اسم\s*الصنف|الكمية|الباركود/.test(s);
function parse(rows){
  const head=rows.slice(0,10).map(r=>(r||[]).join(' ')).join(' ');
  const m=head.match(/(?:رقم المستند|رقم التحويل|رقم الطلب)\s*[:\-]?\s*(\d+)/);
  const out=[];
  let C={q:0,n:11,b:30,c:33};
  const hi=rows.slice(0,15).findIndex(r=>r&&r.some(x=>/اسم\s*الصنف/.test(clean(x))));
  if(hi>=0){
    const f=(re,d)=>{const k=rows[hi].findIndex(x=>re.test(clean(x)));return k>=0?k:d};
    C={q:f(/الكمية\s*الفعلية/,0),n:f(/اسم\s*الصنف/,11),b:f(/الباركود/,30),c:f(/كود\s*الصنف/,33)};
  }
  rows.forEach((r,ri)=>{
    if(!r||ri===hi)return;
    const q=parseFloat(clean(r[C.q]).replace(/,/g,'')),nm=clean(r[C.n]);
    if(q>0&&nm.length>1&&!bad(nm))out.push({qty:q,name:nm,bc:clean(r[C.b]),code:clean(r[C.c])});
  });
  if(!out.length)rows.forEach(r=>{
    if(!r)return;
    let bc='',nm='',q=null;
    r.forEach(c=>{
      const s=clean(c);if(!s)return;
      if(/^\d{12,13}$/.test(s)){if(!bc)bc=s}
      else if(/[\u0600-\u06FF]/.test(s)&&s.length>3&&!bad(s)){if(!nm)nm=s}
      else if(q==null&&/^\d+(\.\d+)?$/.test(s)&&+s>0)q=+s;
    });
    if(nm&&q)out.push({qty:q,name:nm,bc,code:''});
  });
  let from='',to='';
  rows.slice(0,10).forEach((r,i)=>{
    if(!r||from)return;
    const lab=r.findIndex(c=>clean(c)==='فرع الصرف');
    if(lab<0)return;
    const col=r.findIndex((x,j)=>j!==lab&&clean(x));
    if(col<0)return;
    from=clean(r[col]);
    for(let k=1;k<=3;k++){
      const v=clean((rows[i+k]||[])[col]);
      if(v&&/[\u0600-\u06FF]/.test(v)&&!v.includes(':')){to=v;break}
    }
  });
  return{no:m?m[1]:'',from,to,items:out};
}
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  $('gErr').textContent='';
  const fr=new FileReader();
  fr.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null});
      const p=parse(rows);
      if(!p.items.length){$('gErr').textContent='لم يتم العثور على أصناف في الملف. تأكد من صيغة الملف.';return}
      if(p.no)$('fNo').value=p.no;
      if(p.from)$('fFrom').value=p.from;
      if(p.to)$('fTo').value=p.to;
      items=p.items.map(x=>({...x,recv:null,prod:'',years:0,noExp:false,st:null,exp:null}));
      $('modeInfo').textContent='تم تحميل '+items.length+' صنف';
      show('modeM');
    }catch(err){$('gErr').textContent='تعذر قراءة الملف: '+err.message}
  };
  fr.readAsArrayBuffer(f);e.target.value='';
});
function setMode(v){
  needExp=v;show('modeM',false);
  info={no:$('fNo').value,date:$('fDate').value,from:$('fFrom').value,to:$('fTo').value,user:$('fUser').value};
  $('infoBar').innerHTML=[['رقم الإذن',info.no],['من',info.from],['إلى',info.to],['التاريخ',info.date],['المسئول',info.user],['الأصناف',items.length]].filter(c=>c[1]!=='').map(c=>`<span class="chip">${c[0]}<b>${esc(c[1])}</b></span>`).join('');
  show('gate',false);show('work');render();$('q').focus();
}

/* ---------- Table / search ---------- */
function render(){
  const v=$('q').value.trim();
  $('tb').innerHTML=items.map((it,i)=>{
    if(v&&!mt(it,v))return'';
    const s=it.st?`<span class="badge ${ST[it.st][1]}">${ST[it.st][0]}</span>`:'—';
    return`<tr class="${it.recv!=null?'done':''}"><td data-label="م">${i+1}</td><td data-label="الباركود">${esc(it.bc||it.code)}</td><td class="nm">${esc(it.name)}</td><td data-label="المصدرة">${it.qty}</td><td data-label="المستلمة"><b>${it.recv??'—'}</b></td><td data-label="الإنتاج">${it.prod?fm(it.prod):'—'}</td><td data-label="الانتهاء">${it.exp?fm(it.exp):'—'}</td><td class="st" data-label="التقييم">${s}</td><td class="act"><button onclick="openAct(${i})" class="btn btn-pri btn-sm">استلام</button></td></tr>`;
  }).join('');
  const dn=items.filter(i=>i.recv!=null).length;$('prog').textContent='تم استلام '+dn+' من '+items.length;$('barI').style.width=(items.length?dn/items.length*100:0)+'%';
}
function fm(d){
  if(typeof d==='string'){const[y,m]=d.split('-');return m+'/'+y}
  return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
const mt=(it,v)=>v.split(/\s+/).every(t=>it.name.includes(t)||it.bc.includes(t)||it.code.includes(t));
let firstSug=-1;
function sugg(v){
  const m=[];
  if(v.length>=2&&!/^\d+$/.test(v))items.forEach((it,i)=>{if(m.length<8&&mt(it,v))m.push(i)});
  firstSug=m.length?m[0]:-1;
  $('sug').innerHTML=m.map(i=>`<button type="button" onclick="pick(${i})" class="sug-item"><span>${esc(items[i].name)}</span><span class="qn">${items[i].qty}</span></button>`).join('');
  show('sug',m.length>0);
}
function pick(i){$('q').value='';show('sug',false);render();openAct(i)}
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&firstSug>=0){e.preventDefault();pick(firstSug)}});
$('q').addEventListener('input',search);
function search(){
  const v=$('q').value.trim();$('msg').textContent='';sugg(v);
  if(v.length>=4){
    const hit=[];
    items.forEach((it,i)=>{if([it.bc,it.code].some(c=>c&&(c===v||c.endsWith(v))))hit.push(i)});
    if(hit.length===1){$('q').value='';render();openAct(hit[0]);return}
    if(!hit.length)$('msg').textContent='لا يوجد صنف مطابق';
  }
  render();
}

/* ---------- Camera ---------- */
function cam(){
  if(sc)return;
  show('camBox');
  sc=new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:250,height:150}},false);
  sc.render(txt=>{stopCam();$('q').value=txt;search()},()=>{});
}
function stopCam(){
  if(sc){sc.clear().catch(()=>{});sc=null}
  show('camBox',false);
}

/* ---------- Action modal ---------- */
$('yrs').innerHTML=[1,2,3,4,5].map(n=>`<button type="button" data-y="${n}" onclick="setY(${n})" class="yb">${n}</button>`).join('');
function setY(n){
  if($('aNo').checked)return;
  years=n;
  document.querySelectorAll('.yb').forEach(b=>{const on=+b.dataset.y===n;b.classList.toggle('on',on)});
}
function togNo(){
  const n=$('aNo').checked;
  $('aProd').disabled=n;
  document.querySelectorAll('.yb').forEach(b=>b.disabled=n);
  if(n){years=0;setYUI()}
}
function setYUI(){document.querySelectorAll('.yb').forEach(b=>{const on=+b.dataset.y===years;b.classList.toggle('on',on)})}
function openAct(i){
  cur=i;const it=items[i];
  $('aName').textContent=it.name;
  $('aSub').textContent='الباركود: '+(it.bc||it.code||'—')+' — الكمية المصدرة: '+it.qty;
  $('aExp').textContent=it.qty;$('aQty').value=it.recv??it.qty;
  $('aProd').value=it.prod;$('aNo').checked=it.noExp;
  years=it.years;togNo();if(!it.noExp)setYUI();
  show('expBox',needExp);show('actM');
  setTimeout(()=>{$('aQty').focus();$('aQty').select()},50);
}
function evalItem(it){
  if(it.noExp){it.st='none';it.exp=null;return}
  if(!needExp||!it.prod||!it.years){it.st=null;it.exp=null;return}
  const[y,m]=it.prod.split('-').map(Number);
  const p=new Date(y,m-1,1),e=new Date(y+it.years,m-1,1),r=new Date(info.date);
  it.exp=e;
  it.st=r>=e?'exp':(r-p>(e-p)/2?'half':'ok');
}
$('aQty').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();needExp&&!$('aNo').checked?$('aProd').focus():saveAct()}});
function saveAct(){
  const q=parseFloat($('aQty').value);
  if(isNaN(q)||q<0){alert('أدخل الكمية الفعلية');return}
  const no=$('aNo').checked,pr=$('aProd').value;
  if(needExp&&!no&&(!pr||!years)){alert('أدخل تاريخ الإنتاج واختر مدة الصلاحية أو علّم "بدون صلاحية"');return}
  const it=items[cur];
  it.recv=q;it.noExp=needExp&&no;it.prod=it.noExp?'':(needExp?pr:'');it.years=it.noExp?0:(needExp?years:0);
  evalItem(it);
  show('actM',false);render();$('q').focus();
}

/* ---------- Print ---------- */
function finish(){
  const left=items.filter(i=>i.recv==null).length;
  if(left&&!confirm('يوجد '+left+' صنف لم يتم استلامه وسيُحتسب عجزًا. هل تريد المتابعة؟'))return;
  const rows=items.map((it,i)=>{
    const r=it.recv??0,d=r-it.qty;
    const diff=d<0?'عجز ('+Math.abs(d)+')':d>0?'زيادة ('+d+')':'مطابق';
    return`<tr><td>${i+1}</td><td>${esc(it.bc||it.code)}</td><td style="text-align:right">${esc(it.name)}</td><td>${it.qty}</td><td>${it.recv==null?'لم يُستلم':r}</td><td>${diff}</td><td>${it.prod?fm(it.prod):'—'}</td><td>${it.exp?fm(it.exp):'—'}</td><td>${it.st?ST[it.st][0].replace(/[✅⚠️❌]/g,''):'—'}</td></tr>`;
  }).join('');
  $('printDoc').innerHTML=`
  <div style="text-align:center;border-bottom:2px solid #000;padding-bottom:6px"><h1 style="font-size:20px;font-weight:800">أسواق فتح الله ماركت</h1><h2 style="font-size:15px">تقرير استلام تحويل</h2></div>
  <table style="margin-top:8px"><tr><th>رقم الإذن</th><td>${esc(info.no)}</td><th>تاريخ الاستلام</th><td>${esc(info.date)}</td></tr>
  <tr><th>فرع الصرف</th><td>${esc(info.from)}</td><th>فرع الاستلام</th><td>${esc(info.to)}</td></tr></table>
  <table><thead><tr><th>م</th><th>الباركود</th><th>الصنف</th><th>المصدرة</th><th>المستلمة</th><th>الفارق</th><th>الإنتاج</th><th>الانتهاء</th><th>التقييم</th></tr></thead><tbody>${rows}</tbody></table>
  <div style="display:flex;justify-content:space-between;margin-top:50px"><div>مسئول الاستلام: ${esc(info.user)}<br><br>التوقيع: ..............................</div></div>`;
  window.print();
}
function setTheme(t){
  document.documentElement.dataset.theme=t;
  try{localStorage.setItem('rs-theme',t)}catch(e){}
  $('themeBtn').textContent=t==='dark'?'☀️ الوضع الفاتح':'🌙 الوضع الداكن';
}
setTheme((()=>{try{return localStorage.getItem('rs-theme')}catch(e){return null}})()||'dark');
</script>
