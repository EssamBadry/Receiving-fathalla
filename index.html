<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Receiving System 1.4 - أسواق فتح الله ماركت</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Cairo',sans-serif}
.inp{width:100%;background:#0f172a;border:1px solid #475569;border-radius:.5rem;padding:.6rem .8rem;color:#f1f5f9}
.inp:focus{outline:2px solid #f97316;border-color:#f97316}
.inp:disabled{opacity:.4}
#printDoc{display:none}
#reader{width:100%}
@media print{
 @page{size:A4;margin:12mm}
 html,body{background:#fff!important}
 #app,.modal{display:none!important}
 #printDoc{display:block;color:#000;background:#fff;font-size:12px}
 #printDoc table{width:100%;border-collapse:collapse;margin-top:10px}
 #printDoc th,#printDoc td{border:1px solid #000;padding:4px 5px;text-align:center}
 #printDoc th{background:#e5e5e5}
}
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
<div id="app" class="max-w-6xl mx-auto p-4">
 <header class="flex items-center justify-between border-b-4 border-orange-500 pb-3 mb-6">
  <div><h1 class="text-2xl font-extrabold text-orange-500">أسواق فتح الله ماركت</h1><p class="text-slate-400 text-sm">Receiving System 1.4 — استلام التحويلات المخزنية</p></div>
 </header>

 <!-- Upload gateway -->
 <section id="gate" class="max-w-xl mx-auto bg-slate-800 rounded-xl p-6 space-y-4">
  <h2 class="text-lg font-bold">بيانات الإذن</h2>
  <label class="block text-sm">رقم الإذن<input id="fNo" class="inp mt-1" inputmode="numeric"></label>
  <label class="block text-sm">تاريخ الاستلام<input id="fDate" type="date" class="inp mt-1"></label>
  <div class="grid grid-cols-2 gap-3">
   <label class="block text-sm">فرع الصرف<input id="fFrom" class="inp mt-1"></label>
   <label class="block text-sm">فرع الاستلام<input id="fTo" class="inp mt-1"></label>
  </div>
  <label class="block text-sm">اسم المسئول<input id="fUser" class="inp mt-1"></label>
  <label class="block bg-orange-500 hover:bg-orange-600 text-slate-900 font-bold text-center rounded-lg py-3 cursor-pointer">رفع ملف الإذن (Excel / CSV / Xls)
   <input id="file" type="file" accept=".xls,.xlsx,.csv" class="hidden">
  </label>
  <p id="gErr" class="text-red-400 text-sm"></p>
 </section>

 <!-- Workspace -->
 <section id="work" class="hidden">
  <div class="flex flex-wrap gap-2 mb-3">
   <div class="relative flex-1 min-w-[200px]"><input id="q" class="inp" placeholder="اكتب اسم الصنف أو الباركود (4 أرقام أو أكثر)" autocomplete="off"><div id="sug" class="hidden absolute z-30 inset-x-0 mt-1 bg-slate-800 border border-slate-600 rounded-lg max-h-72 overflow-auto shadow-xl"></div></div>
   <button onclick="cam()" class="bg-slate-700 hover:bg-slate-600 rounded-lg px-4 font-semibold">فتح الكاميرا</button>
   <button onclick="finish()" class="bg-orange-500 hover:bg-orange-600 text-slate-900 rounded-lg px-4 py-2 font-bold">إنهاء وطباعة التقرير</button>
  </div>
  <div class="flex justify-between text-sm text-slate-400 mb-2"><span id="prog"></span><span id="msg" class="text-orange-400"></span></div>
  <div id="camBox" class="hidden mb-3 bg-slate-800 rounded-lg p-3"><div id="reader"></div><button onclick="stopCam()" class="mt-2 bg-red-600 rounded px-3 py-1">إغلاق الكاميرا</button></div>
  <div class="overflow-x-auto rounded-lg border border-slate-700">
   <table class="w-full text-sm text-center whitespace-nowrap">
    <thead class="bg-slate-800 text-orange-400"><tr>
     <th class="p-2">م</th><th>الباركود</th><th class="text-right">الاسم</th><th>المصدرة</th><th>المستلمة</th><th>الإنتاج</th><th>الانتهاء</th><th>التقييم</th><th></th>
    </tr></thead>
    <tbody id="tb"></tbody>
   </table>
  </div>
 </section>
</div>

<!-- Mode modal -->
<div id="modeM" class="modal hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
 <div class="bg-slate-800 rounded-xl p-6 w-full max-w-sm text-center">
  <h3 class="text-lg font-bold mb-1">هل الإذن يتطلب صلاحية؟</h3>
  <p id="modeInfo" class="text-slate-400 text-sm mb-5"></p>
  <div class="flex gap-3"><button onclick="setMode(true)" class="flex-1 bg-orange-500 text-slate-900 font-bold rounded-lg py-3">نعم</button><button onclick="setMode(false)" class="flex-1 bg-slate-600 font-bold rounded-lg py-3">لا</button></div>
 </div>
</div>

<!-- Action modal -->
<div id="actM" class="modal hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
 <div class="bg-slate-800 rounded-xl p-6 w-full max-w-md space-y-4">
  <div><h3 id="aName" class="font-bold text-lg"></h3><p id="aSub" class="text-slate-400 text-sm"></p></div>
  <div class="bg-slate-900 rounded-lg p-3 flex justify-between items-center"><span class="text-sm text-slate-400">الكمية في إذن الصرف</span><span id="aExp" class="text-2xl font-extrabold text-orange-400"></span></div>
  <label class="block text-sm">الكمية المستلمة (عدّلها لو مختلفة)<input id="aQty" type="number" min="0" step="any" inputmode="decimal" class="inp mt-1"></label>
  <div id="expBox" class="space-y-3">
   <label class="block text-sm">تاريخ الإنتاج (شهر/سنة)<input id="aProd" type="month" class="inp mt-1"></label>
   <div><p class="text-sm mb-1">مدة الصلاحية (سنوات)</p><div id="yrs" class="grid grid-cols-5 gap-2"></div></div>
   <label class="flex items-center gap-2 text-sm"><input id="aNo" type="checkbox" onchange="togNo()" class="w-4 h-4 accent-orange-500"> بدون صلاحية</label>
  </div>
  <div class="flex gap-3"><button onclick="saveAct()" class="flex-1 bg-orange-500 text-slate-900 font-bold rounded-lg py-3">حفظ</button><button onclick="show('actM',false)" class="flex-1 bg-slate-600 rounded-lg py-3">إلغاء</button></div>
 </div>
</div>

<!-- Print document -->
<div id="printDoc"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const show=(id,v=true)=>$(id).classList.toggle('hidden',!v);
const ST={ok:['سارية (مقبولة) ✅','bg-emerald-600/30 text-emerald-300'],half:['تخطت نصف المدة ⚠️','bg-amber-500/30 text-amber-300'],exp:['منتهي الصلاحية ❌','bg-red-600/30 text-red-300'],none:['بدون صلاحية','bg-slate-600/40 text-slate-300']};
let items=[],needExp=false,cur=-1,years=0,info={},sc=null;
$('fDate').value=new Date().toISOString().slice(0,10);

/* ---------- Parsing ---------- */
const clean=v=>v==null?'':String(v).trim().replace(/\.0+$/,'');
const bad=s=>/اسم\s*الصنف|الكمية|الباركود/.test(s);
function parse(rows){
  const head=rows.slice(0,10).map(r=>(r||[]).join(' ')).join(' ');
  const m=head.match(/(?:رقم المستند|رقم التحويل|رقم الطلب)\s*[:\-]?\s*(\d+)/);
  const out=[];
  let C={q:0,n:11,b:30,c:33};
  const hi=rows.slice(0,15).findIndex(r=>r&&r.some(x=>/اسم\s*الصنف/.test(clean(x))));
  if(hi>=0){
    const f=(re,d)=>{const k=rows[hi].findIndex(x=>re.test(clean(x)));return k>=0?k:d};
    C={q:f(/الكمية\s*الفعلية/,0),n:f(/اسم\s*الصنف/,11),b:f(/الباركود/,30),c:f(/كود\s*الصنف/,33)};
  }
  rows.forEach((r,ri)=>{
    if(!r||ri===hi)return;
    const q=parseFloat(clean(r[C.q]).replace(/,/g,'')),nm=clean(r[C.n]);
    if(q>0&&nm.length>1&&!bad(nm))out.push({qty:q,name:nm,bc:clean(r[C.b]),code:clean(r[C.c])});
  });
  if(!out.length)rows.forEach(r=>{
    if(!r)return;
    let bc='',nm='',q=null;
    r.forEach(c=>{
      const s=clean(c);if(!s)return;
      if(/^\d{12,13}$/.test(s)){if(!bc)bc=s}
      else if(/[\u0600-\u06FF]/.test(s)&&s.length>3&&!bad(s)){if(!nm)nm=s}
      else if(q==null&&/^\d+(\.\d+)?$/.test(s)&&+s>0)q=+s;
    });
    if(nm&&q)out.push({qty:q,name:nm,bc,code:''});
  });
  let from='',to='';
  rows.slice(0,10).forEach((r,i)=>{
    if(!r||from)return;
    const lab=r.findIndex(c=>clean(c)==='فرع الصرف');
    if(lab<0)return;
    const col=r.findIndex((x,j)=>j!==lab&&clean(x));
    if(col<0)return;
    from=clean(r[col]);
    for(let k=1;k<=3;k++){
      const v=clean((rows[i+k]||[])[col]);
      if(v&&/[\u0600-\u06FF]/.test(v)&&!v.includes(':')){to=v;break}
    }
  });
  return{no:m?m[1]:'',from,to,items:out};
}
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  $('gErr').textContent='';
  const fr=new FileReader();
  fr.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null});
      const p=parse(rows);
      if(!p.items.length){$('gErr').textContent='لم يتم العثور على أصناف في الملف. تأكد من صيغة الملف.';return}
      if(p.no)$('fNo').value=p.no;
      if(p.from)$('fFrom').value=p.from;
      if(p.to)$('fTo').value=p.to;
      items=p.items.map(x=>({...x,recv:null,prod:'',years:0,noExp:false,st:null,exp:null}));
      $('modeInfo').textContent='تم تحميل '+items.length+' صنف';
      show('modeM');
    }catch(err){$('gErr').textContent='تعذر قراءة الملف: '+err.message}
  };
  fr.readAsArrayBuffer(f);e.target.value='';
});
function setMode(v){
  needExp=v;show('modeM',false);
  info={no:$('fNo').value,date:$('fDate').value,from:$('fFrom').value,to:$('fTo').value,user:$('fUser').value};
  show('gate',false);show('work');render();$('q').focus();
}

/* ---------- Table / search ---------- */
function render(){
  const v=$('q').value.trim();
  $('tb').innerHTML=items.map((it,i)=>{
    if(v&&!mt(it,v))return'';
    const s=it.st?`<span class="px-2 py-1 rounded ${ST[it.st][1]}">${ST[it.st][0]}</span>`:'—';
    return`<tr class="border-t border-slate-700 ${it.recv!=null?'bg-slate-800/60':''}"><td class="p-2">${i+1}</td><td>${esc(it.bc||it.code)}</td><td class="text-right whitespace-normal min-w-[200px]">${esc(it.name)}</td><td>${it.qty}</td><td class="font-bold">${it.recv??'—'}</td><td>${it.prod?fm(it.prod):'—'}</td><td>${it.exp?fm(it.exp):'—'}</td><td class="p-1">${s}</td><td class="p-1"><button onclick="openAct(${i})" class="bg-orange-500 text-slate-900 font-bold rounded px-3 py-1">استلام</button></td></tr>`;
  }).join('');
  $('prog').textContent='تم استلام '+items.filter(i=>i.recv!=null).length+' من '+items.length;
}
function fm(d){
  if(typeof d==='string'){const[y,m]=d.split('-');return m+'/'+y}
  return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
const mt=(it,v)=>v.split(/\s+/).every(t=>it.name.includes(t)||it.bc.includes(t)||it.code.includes(t));
let firstSug=-1;
function sugg(v){
  const m=[];
  if(v.length>=2&&!/^\d+$/.test(v))items.forEach((it,i)=>{if(m.length<8&&mt(it,v))m.push(i)});
  firstSug=m.length?m[0]:-1;
  $('sug').innerHTML=m.map(i=>`<button type="button" onclick="pick(${i})" class="w-full text-right px-3 py-2 hover:bg-slate-700 border-b border-slate-700 flex justify-between gap-3"><span>${esc(items[i].name)}</span><span class="text-orange-400 whitespace-nowrap">${items[i].qty}</span></button>`).join('');
  show('sug',m.length>0);
}
function pick(i){$('q').value='';show('sug',false);render();openAct(i)}
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&firstSug>=0){e.preventDefault();pick(firstSug)}});
$('q').addEventListener('input',search);
function search(){
  const v=$('q').value.trim();$('msg').textContent='';sugg(v);
  if(v.length>=4){
    const hit=[];
    items.forEach((it,i)=>{if([it.bc,it.code].some(c=>c&&(c===v||c.endsWith(v))))hit.push(i)});
    if(hit.length===1){$('q').value='';render();openAct(hit[0]);return}
    if(!hit.length)$('msg').textContent='لا يوجد صنف مطابق';
  }
  render();
}

/* ---------- Camera ---------- */
function cam(){
  if(sc)return;
  show('camBox');
  sc=new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:250,height:150}},false);
  sc.render(txt=>{stopCam();$('q').value=txt;search()},()=>{});
}
function stopCam(){
  if(sc){sc.clear().catch(()=>{});sc=null}
  show('camBox',false);
}

/* ---------- Action modal ---------- */
$('yrs').innerHTML=[1,2,3,4,5].map(n=>`<button type="button" data-y="${n}" onclick="setY(${n})" class="yb rounded-lg py-2 font-bold bg-slate-700">${n}</button>`).join('');
function setY(n){
  if($('aNo').checked)return;
  years=n;
  document.querySelectorAll('.yb').forEach(b=>{const on=+b.dataset.y===n;b.classList.toggle('bg-orange-500',on);b.classList.toggle('text-slate-900',on);b.classList.toggle('bg-slate-700',!on)});
}
function togNo(){
  const n=$('aNo').checked;
  $('aProd').disabled=n;
  document.querySelectorAll('.yb').forEach(b=>b.disabled=n);
  if(n){years=0;setYUI()}
}
function setYUI(){document.querySelectorAll('.yb').forEach(b=>{const on=+b.dataset.y===years;b.classList.toggle('bg-orange-500',on);b.classList.toggle('text-slate-900',on);b.classList.toggle('bg-slate-700',!on)})}
function openAct(i){
  cur=i;const it=items[i];
  $('aName').textContent=it.name;
  $('aSub').textContent='الباركود: '+(it.bc||it.code||'—')+' — الكمية المصدرة: '+it.qty;
  $('aExp').textContent=it.qty;$('aQty').value=it.recv??it.qty;
  $('aProd').value=it.prod;$('aNo').checked=it.noExp;
  years=it.years;togNo();if(!it.noExp)setYUI();
  show('expBox',needExp);show('actM');
  setTimeout(()=>{$('aQty').focus();$('aQty').select()},50);
}
function evalItem(it){
  if(it.noExp){it.st='none';it.exp=null;return}
  if(!needExp||!it.prod||!it.years){it.st=null;it.exp=null;return}
  const[y,m]=it.prod.split('-').map(Number);
  const p=new Date(y,m-1,1),e=new Date(y+it.years,m-1,1),r=new Date(info.date);
  it.exp=e;
  it.st=r>=e?'exp':(r-p>(e-p)/2?'half':'ok');
}
$('aQty').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();needExp&&!$('aNo').checked?$('aProd').focus():saveAct()}});
function saveAct(){
  const q=parseFloat($('aQty').value);
  if(isNaN(q)||q<0){alert('أدخل الكمية الفعلية');return}
  const no=$('aNo').checked,pr=$('aProd').value;
  if(needExp&&!no&&(!pr||!years)){alert('أدخل تاريخ الإنتاج واختر مدة الصلاحية أو علّم "بدون صلاحية"');return}
  const it=items[cur];
  it.recv=q;it.noExp=needExp&&no;it.prod=it.noExp?'':(needExp?pr:'');it.years=it.noExp?0:(needExp?years:0);
  evalItem(it);
  show('actM',false);render();$('q').focus();
}

/* ---------- Print ---------- */
function finish(){
  const left=items.filter(i=>i.recv==null).length;
  if(left&&!confirm('يوجد '+left+' صنف لم يتم استلامه وسيُحتسب عجزًا. هل تريد المتابعة؟'))return;
  const rows=items.map((it,i)=>{
    const r=it.recv??0,d=r-it.qty;
    const diff=d<0?'عجز ('+Math.abs(d)+')':d>0?'زيادة ('+d+')':'مطابق';
    return`<tr><td>${i+1}</td><td>${esc(it.bc||it.code)}</td><td style="text-align:right">${esc(it.name)}</td><td>${it.qty}</td><td>${it.recv==null?'لم يُستلم':r}</td><td>${diff}</td><td>${it.prod?fm(it.prod):'—'}</td><td>${it.exp?fm(it.exp):'—'}</td><td>${it.st?ST[it.st][0].replace(/[✅⚠️❌]/g,''):'—'}</td></tr>`;
  }).join('');
  $('printDoc').innerHTML=`
  <div style="text-align:center;border-bottom:2px solid #000;padding-bottom:6px"><h1 style="font-size:20px;font-weight:800">أسواق فتح الله ماركت</h1><h2 style="font-size:15px">محضر استلام تحويل مخزني</h2></div>
  <table style="margin-top:8px"><tr><th>رقم الإذن</th><td>${esc(info.no)}</td><th>تاريخ الاستلام</th><td>${esc(info.date)}</td></tr>
  <tr><th>فرع الصرف</th><td>${esc(info.from)}</td><th>فرع الاستلام</th><td>${esc(info.to)}</td></tr></table>
  <table><thead><tr><th>م</th><th>الباركود</th><th>الصنف</th><th>المصدرة</th><th>المستلمة</th><th>الفارق</th><th>الإنتاج</th><th>الانتهاء</th><th>التقييم</th></tr></thead><tbody>${rows}</tbody></table>
  <div style="display:flex;justify-content:space-between;margin-top:50px"><div>مسئول الاستلام: ${esc(info.user)}<br><br>التوقيع: ..............................</div><div>اعتماد المدير: ..............................</div></div>`;
  window.print();
}
</script>
</body>
</html>
