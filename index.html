<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Receiving System</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f97316">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--panel:#fff;--soft:#f8fafc;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b;--acc:#ea580c;--on:#fff;--shadow:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06);
--okb:#d1fae5;--okf:#065f46;--hfb:#fef3c7;--hff:#92400e;--exb:#fee2e2;--exf:#991b1b;--nob:#e2e8f0;--nof:#334155}
[data-theme=dark]{--bg:#0f172a;--panel:#1e293b;--soft:#162032;--line:#334155;--txt:#f1f5f9;--mut:#94a3b8;--acc:#f97316;--on:#0f172a;--shadow:0 8px 28px rgba(0,0,0,.35);
--okb:rgba(16,185,129,.18);--okf:#6ee7b7;--hfb:rgba(245,158,11,.2);--hff:#fcd34d;--exb:rgba(239,68,68,.2);--exf:#fca5a5;--nob:rgba(148,163,184,.2);--nof:#cbd5e1}
*{box-sizing:border-box}
button,input,select{font-family:inherit}
.flex{display:flex}.flex-1{flex:1 1 0%}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.justify-between{justify-content:space-between}.grid{display:grid}.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.col-span-2{grid-column:span 2/span 2}.gap-2{gap:.5rem}.gap-3{gap:.75rem}.gap-4{gap:1rem}.relative{position:relative}.font-extrabold{font-weight:800}.text-sm{font-size:.875rem;line-height:1.25rem}.text-lg{font-size:1.125rem;line-height:1.75rem}.text-xl{font-size:1.25rem;line-height:1.75rem}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;margin:0;transition:background .2s,color .2s}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:1.25rem 1rem 3rem}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--panel);border:1px solid var(--line);border-bottom:4px solid var(--acc);border-radius:1rem;padding:1rem 1.25rem;margin-bottom:1.5rem;box-shadow:var(--shadow)}
.logo{width:54px;height:54px;border-radius:.85rem;background:#fff;border:1px solid var(--line);display:grid;place-items:center;padding:5px;flex:none}.logo img{width:100%;height:100%;object-fit:contain}
.gatelogo{display:block;width:min(260px,70%);margin:0 auto 1.25rem;background:#fff;border-radius:1rem;padding:.6rem}
.topbar h1{font-size:1.35rem;font-weight:800;line-height:1.3;margin:0}
.topbar p{color:var(--mut);font-size:.85rem;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:1rem;box-shadow:var(--shadow)}
.pad{padding:1.5rem}
.lbl{display:block;font-size:.85rem;font-weight:600;color:var(--mut)}
.lbl .inp{margin-top:.45rem}
.inp{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:.7rem;padding:.7rem .9rem;color:var(--txt);font:inherit}
.inp:focus{outline:2px solid var(--acc);outline-offset:1px}
.inp:disabled{opacity:.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border-radius:.7rem;padding:.65rem 1.1rem;font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--soft);color:var(--txt);transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn-pri{background:var(--acc);border-color:var(--acc);color:var(--on)}
